# The only door to the Docker API for `autoheal` (docker-compose.yml).
#
# Whoever reaches the raw Docker socket is root on the host (start a privileged
# container that mounts /). autoheal needs exactly two calls, so this proxy
# passes exactly those and refuses everything else with 403:
#   GET  /containers/json?filters=...        list (unhealthy, labelled) containers
#   POST /containers/<id>/restart?t=<secs>   restart one
# Not allowed, on purpose: inspect (/containers/<id>/json shows every
# container's environment, AUTH_SECRET included), archive/export (files),
# logs, create, start, exec, images, volumes, ... A general-purpose socket
# proxy with "containers + POST" would allow create and start, i.e. root.
#
# Only autoheal shares this proxy's network (an internal network: no other
# container, no internet). Guarded by the Docker images workflow
# (.github/workflows/docker-images.yml, "Docker API proxy").
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout http-request 10s
    timeout connect 5s
    timeout client 60s
    # A restart waits up to the container's stop timeout (autoheal's ?t=).
    timeout server 120s

frontend docker_api
    bind :2375
    # path excludes the query string; url_dec first so %2F cannot smuggle a
    # slash past the id pattern. Ids/names never start with a dot (no "..").
    http-request allow if METH_GET { path,url_dec -m reg ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if METH_POST { path,url_dec -m reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/restart$ }
    http-request deny deny_status 403
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
