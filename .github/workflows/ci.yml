name: CI

# Pull requests run only the jobs their changed paths need (job `changes`,
# .github/scripts/changed-areas.sh) and a lighter sync soak. A push to main,
# the nightly schedule and a manual run run every job with the full soak.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly full run (18:17 UTC = 03:17 JST), off the hour to avoid the
    # scheduler's top-of-hour backlog.
    - cron: '17 18 * * *'
  workflow_dispatch:

# A new push to the same PR / branch supersedes the run in progress. The event
# is part of the group outside PRs so the nightly run and a push to main never
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

# Read-only token: no step publishes anything, and PRs from forks must work
# without secrets.
permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    # Decides which jobs this run needs (see changed-areas.sh for the lists).
    # Every gated job runs when this job's answer is missing (`!= 'false'`), so
    # a failure here runs everything instead of skipping a check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sync: ${{ steps.areas.outputs.sync }}
      client: ${{ steps.areas.outputs.client }}
      ui: ${{ steps.areas.outputs.ui }}
      perf: ${{ steps.areas.outputs.perf }}
      universal: ${{ steps.areas.outputs.universal }}
      server: ${{ steps.areas.outputs.server }}
      admin: ${{ steps.areas.outputs.admin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/changed-areas.sh "$EVENT_NAME" "$BASE_REF"

  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # shared, server, client: tsc --noEmit; admin: next typegen && tsc --noEmit
      - run: pnpm -r typecheck

  test-client:
    name: Client tests (macOS)
    # macOS on purpose. The desktop client ships for macOS (and Windows), and
    # its POSIX spawn wrappers (electron/voice-process.ts,
    # electron/agents/process.ts) run `exec N>&-` through /bin/sh. On macOS that
    # is bash, which handles multi-digit fds; on Ubuntu it is dash, which
    # treats `exec 10>&-` as running a command named "10" and exits. So the
    # voice-helper / voice-polisher tests fail on ubuntu-latest because of a
    # real Linux-only bug in application code, which this CI-only change does
    # not fix. macOS also lets us run the AVFoundation Swift test.
    needs: changes
    # A job skipped by its `if` reports success, so the required check passes
    # for a PR that does not touch what it tests.
    if: ${{ !cancelled() && needs.changes.outputs.client != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # node:test via tsx. tests/*-ui.tsx + *-ui.html are browser preview
      # pages, driven by the Playwright job (ui-client), not node tests.
      - run: npx tsx --test tests/*.test.ts
        working-directory: client
      # Built without -O so Swift's assert() stays active.
      - name: Swift audio level test
        working-directory: client
        run: |
          xcrun swiftc -parse-as-library native/AudioLevel.swift tests/audio-level.test.swift -o "$RUNNER_TEMP/audio-level-test"
          "$RUNNER_TEMP/audio-level-test"
      - name: Swift input route test
        working-directory: client
        run: |
          xcrun swiftc -parse-as-library native/InputRoute.swift tests/input-route.test.swift -o "$RUNNER_TEMP/input-route-test"
          "$RUNNER_TEMP/input-route-test"

  ui-client:
    name: Renderer UI tests (macOS)
    # Playwright drives the renderer's preview pages (client/tests/*-ui.html:
    # real components, preload API and chat server faked) in headless
    # Chromium: what the member sees and can do in the chat, the main screen,
    # the file tree, the editor and settings. macOS like test-client: the
    # app's platform, and the keyboard hints (⌘) the tests read.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ui != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: playwright
        working-directory: client
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install headless Chromium
        working-directory: client
        run: npx playwright install --only-shell chromium
      - name: Type-check the UI tests and preview pages
        working-directory: client
        run: npx tsc -p tests/ui
      - name: Run the UI tests
        working-directory: client
        run: npx playwright test
        env:
          UI_TEST_WORKERS: '3'
      - name: Upload the report (traces, screenshots) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  sync-harness-shard:
    name: Sync harness ${{ matrix.shard }}/4 (macOS)
    # git:sync (client/electron/sync/) driven end to end: several members per
    # company against a real bare repository with the production pre-receive
    # hook, scripted dialog answers, the characterization recording, and a
    # seeded randomized soak. Separate from test-client so the two run in
    # parallel. macOS for the same reasons as test-client (the client's main
    # platform; /bin/sh is bash).
    #
    # Split over 4 runners by file groups balanced by duration
    # (.github/scripts/sync-shard.mjs; the last shard also runs any file not
    # listed there). The required check is the `sync-harness` job below.
    #
    # Soak: pull requests run one seed of each world (plain, mixed with
    # partial clones, private folders) x 6 rounds; push to main, nightly and
    # manual runs the full 3 + 2 + 2 seeds x 8 rounds.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sync != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: git --version
      - name: Run this shard's test files
        working-directory: client
        env:
          SHARD: ${{ matrix.shard }}
          SYNC_SOAK_SEEDS: ${{ github.event_name == 'pull_request' && '1' || '1,2,3' }}
          SYNC_SOAK_MIXED_SEEDS: ${{ github.event_name == 'pull_request' && '101' || '101,102' }}
          SYNC_SOAK_PRIVATE_SEEDS: ${{ github.event_name == 'pull_request' && '201' || '201,202' }}
          SYNC_SOAK_MEMBERS: '3'
          SYNC_SOAK_ROUNDS: ${{ github.event_name == 'pull_request' && '6' || '8' }}
        run: |
          files=$(node ../.github/scripts/sync-shard.mjs "$SHARD")
          echo "Shard $SHARD: $files"
          # shellcheck disable=SC2086 # word splitting is the point
          npx tsx --test $files

  sync-harness:
    name: Sync harness (macOS)
    # The required status check: green when every shard passed, or when the
    # shards were skipped because the PR does not touch sync; red for a failed
    # or cancelled shard. On ubuntu so it costs no macOS runner.
    needs: [changes, sync-harness-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS: ${{ needs.sync-harness-shard.result }}
          WANTED: ${{ needs.changes.outputs.sync }}
        run: |
          echo "shards: $SHARDS (sync changed: ${WANTED:-unknown})"
          case "$SHARDS" in
            success) exit 0 ;;
            skipped) [ "$WANTED" = false ] && exit 0 ;;
          esac
          echo "::error::Sync harness shards did not pass ($SHARDS)"
          exit 1

  perf-baselines:
    name: Performance baselines (macOS)
    # Guards the recent performance wins against order-of-magnitude
    # regressions: one recursive watcher per company and a lazy file tree
    # (#151), the capped company search and git log without --follow (#153),
    # the history store and windowed chat rendering (#154), and the renderer
    # bundle size. Budgets are ~10x a developer Mac's numbers (runners vary);
    # every check prints a `[perf] name=value` line, so the measured values
    # stay in this job's log. Separate from test-client so a flaky timing is
    # visible as such. macOS like the other client jobs (recursive fs.watch
    # is FSEvents there, as on members' Macs).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.perf != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Benchmarks
        working-directory: client
        run: npx tsx --test --test-concurrency=1 tests/perf/*.perf.test.ts
      - name: Renderer bundle size
        working-directory: client
        run: |
          npx vite build
          node scripts/check-bundle-size.mjs dist

  universal-git:
    name: Universal bundled git (macOS)
    # The mac app ships dugite's git as a universal binary merged from the
    # arm64 and x64 dugite-native archives (client/scripts/universal-git.mjs,
    # run as electron-builder's beforePack). An arm64-only git made Intel Macs
    # fall back to Apple Git 2.39, whose push is broken. On pull requests it
    # runs only when the merge script, the client's package.json, the lockfile
    # or the workflow changes (job `changes`); the merge itself takes seconds.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.universal != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Merge the arm64 and x64 dugite-native archives
        working-directory: client
        run: node scripts/universal-git.mjs --out "$RUNNER_TEMP/git-universal"
      - name: Every Mach-O is universal; both slices run
        env:
          DIR: ${{ runner.temp }}/git-universal
        run: |
          node client/scripts/universal-git.mjs --verify "$DIR"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          export GIT_EXEC_PATH="$DIR/libexec/git-core" GIT_CONFIG_NOSYSTEM=1
          for a in x86_64 arm64; do
            echo "== $a"
            arch -"$a" "$DIR/bin/git" --version
            arch -"$a" "$DIR/bin/git" lfs version
            # git-remote-https is a child of git: it must run in the same slice.
            arch -"$a" "$DIR/bin/git" -c protocol.version=2 ls-remote https://github.com/git/git HEAD
          done
          arch -x86_64 "$DIR/bin/git" lfs version | grep -q 'darwin amd64'

  test-server:
    name: Server tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vitest run
        working-directory: server

  test-admin:
    name: Admin tests
    # API client against contract fixtures + page rendering (loading / empty /
    # error states, role-dependent controls) in jsdom. A few seconds; no
    # browser download.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.admin != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vitest run
        working-directory: admin

  lint-changed:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge base with main is available.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Resolve base commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "Linting changes since $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: .github/scripts/lint-changed.sh "${{ steps.base.outputs.sha }}"
