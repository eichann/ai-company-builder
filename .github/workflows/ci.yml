name: CI

# Pull requests run only the jobs their changed paths need (job `changes`,
# .github/scripts/changed-areas.sh) and a lighter sync soak. A push to main
# runs only the Linux jobs (the PR already ran the macOS ones; macOS runners are
# scarce and a full run per merge queued the next PR's checks). The nightly
# schedule and a manual run run every job with the full soak.
#
# macOS runners are the bottleneck, so only what needs a Mac runs on one: the
# client tests that depend on macOS (client-tests.mjs, list MACOS) and the
# Swift tests, the sync harness, the performance baselines and the universal
# git merge. Everything else runs on ubuntu.
#
# Where the macOS jobs run (job `changes`, output `mac-runner`): the repository
# variable MAC_RUNNER names a self-hosted Mac's runner label; unset, they run
# on GitHub's macos-latest. Pull requests from forks always go to macos-latest,
# never to the self-hosted Mac (setup and the runner-side guard:
# .claude/rules/deployment.md "Self-hosted Mac runner").
on:
  pull_request:
    # next/** are integration branches (e.g. next/sales-meeting): their PRs get the same checks.
    branches: [main, 'next/**']
  push:
    # Pushes to next/** are covered by their PRs; only main is checked on push.
    branches: [main]
  schedule:
    # Nightly full run (18:17 UTC = 03:17 JST), off the hour to avoid the
    # scheduler's top-of-hour backlog.
    - cron: '17 18 * * *'
  workflow_dispatch:

# A new push to the same PR / branch supersedes the run in progress. The event
# is part of the group outside PRs so the nightly run and a push to main never
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

# Read-only token: no step publishes anything, and PRs from forks must work
# without secrets.
permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    # Decides which jobs this run needs (see changed-areas.sh for the lists).
    # Every gated job runs when this job's answer is missing (`!= 'false'`), so
    # a failure here runs everything instead of skipping a check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sync: ${{ steps.areas.outputs.sync }}
      client: ${{ steps.areas.outputs.client }}
      clientmac: ${{ steps.areas.outputs.clientmac }}
      ui: ${{ steps.areas.outputs.ui }}
      perf: ${{ steps.areas.outputs.perf }}
      universal: ${{ steps.areas.outputs.universal }}
      server: ${{ steps.areas.outputs.server }}
      admin: ${{ steps.areas.outputs.admin }}
      # The runner label for every macOS job. The self-hosted Mac
      # (vars.MAC_RUNNER) only for code from this repository: a push, the
      # nightly / manual run, or a pull request whose branch is in this
      # repository. A fork's pull request is never sent to it. A job reading
      # this output falls back to macos-latest when it is missing.
      mac-runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MAC_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/changed-areas.sh "$EVENT_NAME" "$BASE_REF"

  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # shared, server, client: tsc --noEmit; admin: next typegen && tsc --noEmit
      - run: pnpm -r typecheck

  test-client-linux:
    name: Client tests 1/2 (Linux)
    # Every client node test that does not need a Mac (most of them: pure
    # logic, the IPC harness, real git in temp folders). node:test via tsx;
    # .github/scripts/client-tests.mjs lists tests/*.test.ts and the colocated
    # renderer tests (src/**/*.test.ts) minus its MACOS list. tests/*-ui.tsx +
    # *-ui.html are preview pages for the Playwright job, not node tests. Part
    # of the required check "Client tests (macOS)" (job test-client).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.client != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Node tests (tests/ and colocated src/, all but the macOS list)
        run: node .github/scripts/client-tests.mjs linux

  test-client-macos:
    name: Client tests 2/2 (macOS)
    # The client tests that guard what only a Mac shows (client-tests.mjs,
    # list MACOS, with the reason for each file): the POSIX spawn wrappers
    # (electron/voice-process.ts, electron/agents/process.ts) run `exec N>&-`
    # through /bin/sh, which is bash on macOS and dash on Ubuntu (dash fails on
    # multi-digit fds: a known Linux-only bug; Linux is not a shipped
    # platform); recursive fs.watch is FSEvents; the file-system guards assert
    # the case- and normalization-insensitive volume. Plus the AVFoundation
    # Swift tests. Runs when what those files load changes (area clientmac:
    # client/electron/, client/shared/, shared/, the Swift sources, ...), not
    # for renderer-only changes. Part of the required check
    # "Client tests (macOS)".
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.clientmac != 'false' }}
    runs-on: ${{ needs.changes.outputs.mac-runner || 'macos-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Node tests (the macOS list)
        run: node .github/scripts/client-tests.mjs macos
      # Built without -O so Swift's assert() stays active.
      - name: Swift audio level test
        working-directory: client
        run: |
          xcrun swiftc -parse-as-library native/AudioLevel.swift tests/audio-level.test.swift -o "$RUNNER_TEMP/audio-level-test"
          "$RUNNER_TEMP/audio-level-test"
      - name: Swift input route test
        working-directory: client
        run: |
          xcrun swiftc -parse-as-library native/InputRoute.swift tests/input-route.test.swift -o "$RUNNER_TEMP/input-route-test"
          "$RUNNER_TEMP/input-route-test"

  test-client:
    name: Client tests (macOS)
    # The required status check (the name branch protection knows): green
    # when both halves passed, or a half was skipped because the PR does not
    # touch what it tests; red for a failed or cancelled half. Same meaning as
    # before the split: every client node test and the Swift tests pass. On
    # ubuntu so it costs no macOS runner.
    needs: [changes, test-client-linux, test-client-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LINUX: ${{ needs.test-client-linux.result }}
          MACOS: ${{ needs.test-client-macos.result }}
          WANT_LINUX: ${{ needs.changes.outputs.client }}
          WANT_MACOS: ${{ needs.changes.outputs.clientmac }}
        run: |
          echo "linux: $LINUX (wanted: ${WANT_LINUX:-unknown}), macos: $MACOS (wanted: ${WANT_MACOS:-unknown})"
          ok() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          if ok "$LINUX" "$WANT_LINUX" && ok "$MACOS" "$WANT_MACOS"; then exit 0; fi
          echo "::error::Client tests did not pass (linux: $LINUX, macos: $MACOS)"
          exit 1

  ui-client:
    name: Renderer UI tests (Linux)
    # Playwright drives the renderer's preview pages (client/tests/*-ui.html:
    # real components, preload API and chat server faked) in headless
    # Chromium: what the member sees and can do in the chat, the main screen,
    # the file tree, the editor and settings. Nothing here depends on macOS:
    # the pages run in the browser only, shortcuts are matched as ⌘ or Ctrl
    # (shared/commands), and the specs press ControlOrMeta where the OS
    # decides. On ubuntu since 2026-11-02 to free macOS runners.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ui != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: playwright
        working-directory: client
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # --with-deps installs the shell's system libraries and fonts (apt);
      # the browser itself comes from the cache when it is there.
      - name: Install headless Chromium
        working-directory: client
        run: npx playwright install --with-deps --only-shell chromium
      - name: Type-check the UI tests and preview pages
        working-directory: client
        run: npx tsc -p tests/ui
      - name: Run the UI tests
        working-directory: client
        run: npx playwright test
        env:
          UI_TEST_WORKERS: '3'
      - name: Upload the report (traces, screenshots) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  bundle-size:
    name: Renderer bundle size (Linux)
    # The renderer bundle stays within its budget (check-bundle-size.mjs,
    # testing.md "Performance baselines"). The JS Vite emits does not depend on
    # the OS, so this left the macOS perf job on 2026-11-02. Same area as the
    # UI tests (what the renderer bundle is built from).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ui != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Renderer bundle size
        working-directory: client
        run: |
          npx vite build
          node scripts/check-bundle-size.mjs dist

  sync-harness-shard:
    name: Sync harness ${{ matrix.shard }}/4 (macOS)
    # git:sync (client/electron/sync/) driven end to end: several members per
    # company against a real bare repository with the production pre-receive
    # hook, scripted dialog answers, the characterization recording, and a
    # seeded randomized soak. Separate from test-client so the two run in
    # parallel. Stays on macOS: members' company folders sit on APFS, which is
    # case- and normalization-insensitive, so git clones there with
    # core.ignorecase / core.precomposeunicode and every rename, case-variant
    # and NFD scenario (private-folder names, exclusions, conflicts) behaves as
    # on a member's Mac; on Linux's case-sensitive file system those scenarios
    # would pass while guarding something else (folder-exclusions even skips
    # its case-variant scenario there). Runs only for changes to what sync
    # loads (area sync), never for renderer-only changes.
    #
    # Split over 4 runners by file groups balanced by duration
    # (.github/scripts/sync-shard.mjs; private-folders.test.ts is split over
    # two shards, and the last shard also runs any file not listed there).
    # The required check is the `sync-harness` job below.
    #
    # Soak: pull requests run one seed of each world (plain, mixed with
    # partial clones, private folders) x 6 rounds; push to main, nightly and
    # manual runs the full 3 + 2 + 2 seeds x 8 rounds.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sync != 'false' }}
    runs-on: ${{ needs.changes.outputs.mac-runner || 'macos-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: git --version
      - name: Run this shard's test files
        env:
          SHARD: ${{ matrix.shard }}
          SYNC_SOAK_SEEDS: ${{ github.event_name == 'pull_request' && '1' || '1,2,3' }}
          SYNC_SOAK_MIXED_SEEDS: ${{ github.event_name == 'pull_request' && '101' || '101,102' }}
          SYNC_SOAK_PRIVATE_SEEDS: ${{ github.event_name == 'pull_request' && '201' || '201,202' }}
          SYNC_SOAK_MEMBERS: '3'
          SYNC_SOAK_ROUNDS: ${{ github.event_name == 'pull_request' && '6' || '8' }}
        run: node .github/scripts/sync-shard.mjs "$SHARD"

  sync-harness:
    name: Sync harness (macOS)
    # The required status check: green when every shard passed, or when the
    # shards were skipped because the PR does not touch sync; red for a failed
    # or cancelled shard. On ubuntu so it costs no macOS runner.
    needs: [changes, sync-harness-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS: ${{ needs.sync-harness-shard.result }}
          WANTED: ${{ needs.changes.outputs.sync }}
        run: |
          echo "shards: $SHARDS (sync changed: ${WANTED:-unknown})"
          case "$SHARDS" in
            success) exit 0 ;;
            skipped) [ "$WANTED" = false ] && exit 0 ;;
          esac
          echo "::error::Sync harness shards did not pass ($SHARDS)"
          exit 1

  perf-baselines:
    name: Performance baselines (macOS)
    # Guards the recent performance wins against order-of-magnitude
    # regressions: one recursive watcher per company and a lazy file tree
    # (#151), the capped company search and git log without --follow (#153),
    # the history store and windowed chat rendering (#154). Budgets are ~10x
    # a developer Mac's numbers (runners vary); every check prints a
    # `[perf] name=value` line, so the measured values stay in this job's log.
    # Separate from test-client so a flaky timing is visible as such. Stays on
    # macOS: recursive fs.watch is FSEvents there, as on members' Macs (one
    # handle for 15k files), and the budgets are Mac numbers. The renderer
    # bundle size moved to the Linux job bundle-size. Runs only for changes to
    # what the benchmarks load (area perf).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.perf != 'false' }}
    runs-on: ${{ needs.changes.outputs.mac-runner || 'macos-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Benchmarks
        working-directory: client
        run: npx tsx --test --test-concurrency=1 tests/perf/*.perf.test.ts

  universal-git:
    name: Universal bundled git (macOS)
    # The mac app ships dugite's git as a universal binary merged from the
    # arm64 and x64 dugite-native archives (client/scripts/universal-git.mjs,
    # run as electron-builder's beforePack). An arm64-only git made Intel Macs
    # fall back to Apple Git 2.39, whose push is broken. On pull requests it
    # runs only when the merge script, the client's package.json, the lockfile
    # or the workflow changes (job `changes`); the merge itself takes seconds.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.universal != 'false' }}
    runs-on: ${{ needs.changes.outputs.mac-runner || 'macos-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Merge the arm64 and x64 dugite-native archives
        working-directory: client
        run: node scripts/universal-git.mjs --out "$RUNNER_TEMP/git-universal"
      - name: Every Mach-O is universal; both slices run
        env:
          DIR: ${{ runner.temp }}/git-universal
        run: |
          node client/scripts/universal-git.mjs --verify "$DIR"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          export GIT_EXEC_PATH="$DIR/libexec/git-core" GIT_CONFIG_NOSYSTEM=1
          for a in x86_64 arm64; do
            echo "== $a"
            arch -"$a" "$DIR/bin/git" --version
            arch -"$a" "$DIR/bin/git" lfs version
            # git-remote-https is a child of git: it must run in the same slice.
            arch -"$a" "$DIR/bin/git" -c protocol.version=2 ls-remote https://github.com/git/git HEAD
          done
          arch -x86_64 "$DIR/bin/git" lfs version | grep -q 'darwin amd64'

  test-server:
    name: Server tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vitest run
        working-directory: server

  test-admin:
    name: Admin tests
    # API client against contract fixtures + page rendering (loading / empty /
    # error states, role-dependent controls) in jsdom. A few seconds; no
    # browser download.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.admin != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vitest run
        working-directory: admin

  lint-changed:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge base with main is available.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Resolve base commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "Linting changes since $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: .github/scripts/lint-changed.sh "${{ steps.base.outputs.sha }}"
      # changed-areas.sh's lists must cover what each area's tests import,
      # or a PR could skip a test it affects (the files to add are printed).
      - name: CI area lists cover what the tests load
        run: node .github/scripts/check-areas.mjs
