# =============================================================================
# AI Company Builder - Production Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. From the repo root:
#      docker compose --project-directory . -f docs/self-hosting/docker-compose.production.yml up -d --build
#
# IMPORTANT: Ports bind to 127.0.0.1 only.
# Use a reverse proxy (Caddy recommended) for external access.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - AUTH_SECRET=${AUTH_SECRET}
      - SERVER_HOST=${SERVER_HOST}
      - SERVER_USER=${SERVER_USER}
      - HOST_REPOS_DIR=${HOST_REPOS_DIR}
      # Optional key broker KEK (README "Key broker"); /dev/null = broker off.
      - BROKER_KEK_FILE=/run/secrets/broker-kek
      - BROKER_TOKEN_TTL_MINUTES=${BROKER_TOKEN_TTL_MINUTES:-30}
      # The relay's largest request (MB) and wait for an answer (seconds).
      - BROKER_MAX_REQUEST_MB=${BROKER_MAX_REQUEST_MB:-100}
      - BROKER_UPSTREAM_TIMEOUT_SECONDS=${BROKER_UPSTREAM_TIMEOUT_SECONDS:-600}
      # Check a key once when it is saved (off: a server without internet access).
      - BROKER_KEY_CHECK=${BROKER_KEY_CHECK:-on}
      # Where the daily caps' day begins, minutes east of UTC (540 = Japan).
      - BROKER_DAY_UTC_OFFSET_MINUTES=${BROKER_DAY_UTC_OFFSET_MINUTES:-540}
    # Runs the code baked into the image (no source mount, read-only root
    # filesystem): updates need `up -d --build`, as in the guide's Updating
    # section. The server writes only under /app/data and /tmp.
    read_only: true
    volumes:
      - ./data:/app/data
      - api-tmp:/tmp
      - ${BROKER_KEK_HOST_FILE:-/dev/null}:/run/secrets/broker-kek:ro
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
      - "127.0.0.1:3100:3100"
    # Production build (next build + standalone server). Code updates need
    # `up -d --build`, which the Updating section of the guide already uses.
    environment:
      # Server-side /api/* proxy target, read at runtime — must reach the api
      # container over the compose network (localhost inside the admin
      # container is admin itself)
      - API_PROXY_URL=http://api:3001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-tmp:
