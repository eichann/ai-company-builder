<!DOCTYPE html>
<html lang="ja">
  <head>
    <script>
      // Apply theme immediately to prevent flash
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- img-src: no blanket https:. A remote image is a request the renderer makes on its own,
         so anything that can put an <img> on screen (AI chat output, a shared .md file) could
         send data out in its URL. Allowed: the app itself, local-file: (workspace previews),
         data:/blob: (attachments), and image.docbase.io (DocBase-imported .md files, which
         main.ts serves with the user's DocBase cookie). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*; img-src 'self' local-file: data: blob: https://image.docbase.io; object-src blob:; frame-src blob:">
    <title>AI Company Builder</title>
  </head>
  <body class="bg-gray-100 dark:bg-zinc-950 text-gray-900 dark:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
