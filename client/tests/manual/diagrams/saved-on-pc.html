<!-- The manual's chapter 5: what is written is saved on the member's PC at once, and reaches the
     company (and the others) only with the sync button. Shot by shoot.spec.ts (scenes.ts). -->
<style>
  body { margin: 0; background: var(--color-surface); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; color: var(--color-text); }
  #diagram { width: 960px; padding: 30px 32px 34px; box-sizing: border-box; background: var(--color-surface); }
  .row { display: flex; align-items: stretch; gap: 0; }
  .box { flex: 1; padding: 16px 16px 18px; border-radius: 14px; border: 2px solid var(--color-border-strong); background: var(--color-bg); text-align: center; }
  .box .title { font-size: 17px; font-weight: 700; }
  .box .what { margin-top: 8px; font-size: 14px; line-height: 1.6; color: var(--color-text-muted); }
  .box.pc { border-color: var(--color-primary); background: var(--color-selected-bg); }
  .box.server { border-color: var(--color-border-strong); }
  .arrow { width: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .arrow .when { padding: 3px 10px; border-radius: 9999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .arrow .when.auto { background: var(--color-success-bg); color: var(--color-success-text); border: 1px solid var(--color-success-border); }
  .arrow .when.sync { background: var(--color-surface); color: var(--color-selected-text); border: 2px solid var(--color-primary); }
  .arrow svg { display: block; }
  .note { margin-top: 18px; padding: 12px 16px; border-radius: 10px; background: var(--color-warning-bg); border: 1px solid var(--color-warning-border); color: var(--color-warning-text); font-size: 14px; text-align: center; }
</style>
<div id="diagram">
  <div class="row">
    <div class="box"><div class="title">あなたが書く</div><div class="what">ACB の画面で<br>ファイルを直す</div></div>
    <div class="arrow">
      <span class="when auto">自動で保存（1秒ほど）</span>
      <svg width="120" height="20" viewBox="0 0 120 20" aria-hidden="true"><path d="M4 10 H108" stroke="var(--color-success-icon)" stroke-width="3" /><path d="M104 3 L116 10 L104 17 z" fill="var(--color-success-icon)" /></svg>
    </div>
    <div class="box pc"><div class="title">あなたの PC の<br>会社フォルダ</div><div class="what">ここに保存されます。<br>まだあなただけが見られます</div></div>
    <div class="arrow">
      <span class="when sync">［サーバーと同期］</span>
      <svg width="120" height="20" viewBox="0 0 120 20" aria-hidden="true"><path d="M4 10 H108" stroke="var(--color-primary)" stroke-width="3" /><path d="M104 3 L116 10 L104 17 z" fill="var(--color-primary)" /></svg>
    </div>
    <div class="box server"><div class="title">会社のサーバー</div><div class="what">ここに届くと、<br>みんなに見えるようになります</div></div>
  </div>
  <div class="note">自動で保存されるのは、あなたの PC の中だけ。会社に届けるのは［サーバーと同期］を押したときです。</div>
</div>
