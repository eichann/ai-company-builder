# The business plugin using sample-portal: which of its calls it uses, who may,
# and the event it reacts to (plugins.md "Contract 3").
id: sample-portal-care
label: 見本のお問い合わせ
version: 0.1.0
kind: official
contract: 3
types: [inquiry]
connector: sample-portal >= 1.0.0
roles:
  support: { label: 窓口の担当 }
calls:
  diagnose: { who: ["role:support", ai] }
  find_person: { who: ["role:support", ai] }
  mail: { who: ["role:support"] }
  pages: { who: ["role:support", admin, ai] }
  resend: { who: ["role:support", ai], decision: true }
steps:
  look_up:
    label: 窓口で調べる
    for: { type: inquiry, state: open }
    start: person
    procedure: { default: steps/look-up.md, overridable: false }
    tools: [records, plugin_operations]
  note_only:
    label: メモだけ
    for: { type: inquiry, state: open }
    start: person
    procedure: { default: steps/look-up.md, overridable: false }
    tools: [records]
  auto_look_up:
    label: 自動で調べる
    for: { type: inquiry, state: open }
    start: ai_turn
    procedure: { default: steps/look-up.md, overridable: false }
    tools: [records, plugin_operations]
events:
  recovered: { type: inquiry, match: person_ref, action: close_by_event }
