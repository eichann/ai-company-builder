# A business plugin for the public repository's tests (owner decision
# 2026-11-01): it owns the deal / customer types and uses the HubSpot-shaped
# connector sample-hub — which of its objects become which type, which of its
# operations it uses and who may run them, its field policy defaults. The real
# one, 「法人営業」 (corporate-sales), lives in the private acb-plugins repository.
id: sample-sales
label: 見本の営業
version: 0.1.0
kind: official
contract: 1
description: 案件と顧客の型
types: [deal, customer]
connector: sample-hub >= 0.1.0

objects:
  deal: { record_type: deal }
  company: { record_type: customer }
  # A deal's contacts as outbound mail's recipients (outbound-mail.md): no record (people are never imported).
  contact: {}

operations:
  refresh_deal:
    who: [viewer, ai]
  update_deal:
    who: [assignee, dept_manager, admin, ai]
    note: optional
    decision: true
  add_note:
    who: [assignee, dept_manager, admin, ai]
    policy: prior
  # Approval by default; the company chooses `log_meeting: auto` in its mapping, with the acknowledgement.
  log_meeting:
    who: [assignee, dept_manager, admin, ai]
    policy: prior
  create_deal:
    who: [viewer, ai]

field_policy_defaults:
  next_step: auto
  stage: prior
  confidence: auto
  close_date: auto
  amount: prior
  closed: prior
