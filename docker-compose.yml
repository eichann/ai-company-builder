services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # Default binds to loopback only: nothing on the LAN/internet can reach
      # the API directly, regardless of firewall layers. Use a reverse proxy
      # (Caddy) for external access.
      # Known issue: OrbStack (<= 2.2.0) fails to forward loopback-bound ports
      # when host and container ports match — set BIND_ADDR=0.0.0.0 in .env
      # as a workaround (see https://github.com/orbstack/orbstack/issues/944).
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env file}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3001}
      - SERVER_HOST=${SERVER_HOST:-localhost}
      - SERVER_USER=${SERVER_USER:-deploy}
      - HOST_REPOS_DIR=${HOST_REPOS_DIR:-/app/data/repos}
      # Cap Node heap so a slow leak triggers a clean OOM-restart instead of dragging the host down
      - NODE_OPTIONS=--max-old-space-size=2048
      # The key broker's key-encryption key (KEK), mounted read-only below.
      # Optional: without BROKER_KEK_HOST_FILE in .env the mount is /dev/null
      # and the broker stays off (the server runs as before).
      - BROKER_KEK_FILE=/run/secrets/broker-kek
      # Lifetime of the key broker's tokens in minutes (15-60, default 30).
      - BROKER_TOKEN_TTL_MINUTES=${BROKER_TOKEN_TTL_MINUTES:-30}
      # The relay's largest request (MB) and wait for an answer (seconds).
      - BROKER_MAX_REQUEST_MB=${BROKER_MAX_REQUEST_MB:-100}
      - BROKER_UPSTREAM_TIMEOUT_SECONDS=${BROKER_UPSTREAM_TIMEOUT_SECONDS:-600}
      # Check a key once when it is saved (off: a server without internet access).
      - BROKER_KEY_CHECK=${BROKER_KEY_CHECK:-on}
      # Where the daily caps' day begins, minutes east of UTC (540 = Japan).
      - BROKER_DAY_UTC_OFFSET_MINUTES=${BROKER_DAY_UTC_OFFSET_MINUTES:-540}
      # Staging only: HubSpot → the practice HubSpot (.env.example). Not in the production
      # compose file; the server also ignores it when NODE_ENV=production or PUBLIC_URL is public.
      - ACB_ALLOW_FAKE_UPSTREAMS=${ACB_ALLOW_FAKE_UPSTREAMS:-}
      - ACB_FAKE_HUBSPOT_URL=${ACB_FAKE_HUBSPOT_URL:-}
      - ACB_FAKE_GOOGLE_URL=${ACB_FAKE_GOOGLE_URL:-}
      - ACB_FAKE_SLACK_URL=${ACB_FAKE_SLACK_URL:-}
      # Who may create companies after the first one: the operators' user ids
      # (comma-separated). Policy: operator (default; the only one so far).
      - OPERATOR_USER_IDS=${OPERATOR_USER_IDS:-}
      - COMPANY_CREATION_POLICY=${COMPANY_CREATION_POLICY:-operator}
      # Where members download the desktop app (https only; shown on the invitation page).
      - APP_DOWNLOAD_URL=${APP_DOWNLOAD_URL:-}
    # The code is the image's (server/Dockerfile): no source mount, no watch.
    # Server changes need a rebuild (`docker compose up -d --build api`); for
    # hot reload run `pnpm dev:server` on the host instead (README "Develop").
    # The root filesystem is read-only, so nothing — not even a compromised
    # server process — can change the code it runs; the server writes only
    # under /app/data (databases, repositories) and /tmp (push-check
    # snapshots, make-public scratch clones; disk-backed, not tmpfs, since a
    # scratch clone can be large).
    read_only: true
    # Never root (server/Dockerfile ends with USER node): ./data and the KEK
    # file belong to this uid/gid on the host — default 1000:1000, the usual
    # first user; set ACB_UID / ACB_GID in .env to `id -u` / `id -g` of the
    # owner of ./data otherwise. No capabilities, no setuid gains: the server
    # binds a port above 1024 and touches only files it owns.
    user: "${ACB_UID:-1000}:${ACB_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # SQLite databases, company repositories, archives (owned by ACB_UID)
      - ./data:/app/data
      - api-tmp:/tmp
      # Key broker KEK: a 0600 file owned by ACB_UID, OUTSIDE ./data (database
      # backups must not contain it) and outside this checkout. See .env.example.
      - ${BROKER_KEK_HOST_FILE:-/dev/null}:/run/secrets/broker-kek:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:3001/api/config\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

  admin:
    # Production build (next build + standalone server), also for local runs:
    # the admin is internet-facing in production and must not run `next dev`.
    # Source changes need a rebuild (`docker compose up -d --build admin`);
    # for hot reload run `pnpm dev:admin` on the host instead (README "Develop").
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
      # Loopback by default — see the api service note
      - "${BIND_ADDR:-127.0.0.1}:3100:3100"
    environment:
      # Server-side /api/* proxy target, read at runtime by admin/src/proxy.ts —
      # must reach the api container over the compose network (localhost
      # inside the admin container is admin itself)
      - API_PROXY_URL=http://api:3001
      # Cap Node heap (smaller than api: admin is mostly static rendering)
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - api
    # Runs as the image's `node` user (admin/Dockerfile), with no capabilities
    # and a read-only root filesystem: the standalone server writes only its
    # cache (.next/cache, e.g. image optimisation) and scratch files, both in
    # memory here.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/admin/.next/cache:mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:3100/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

  # Restarts a container whose healthcheck fails (label autoheal=true): Docker
  # itself only restarts containers that exit. autoheal never sees the Docker
  # socket — whoever holds it is root on the host — only docker-api-proxy,
  # which lets through exactly "list containers" and "restart a container"
  # (deploy/docker-api-proxy.cfg), on a network no other container joins.
  # Images are pinned by digest; to update, look up the new digest
  # (`docker buildx imagetools inspect <image>:<tag>`) and change both here.
  autoheal:
    image: willfarrell/autoheal:latest@sha256:221c1c842f59ff74ac332b38a2f79e3fc3cf93fc2af453e15ed24e9605010326
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - DOCKER_SOCK=tcp://docker-api-proxy:2375
    depends_on:
      - docker-api-proxy
    networks:
      - docker-api
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  docker-api-proxy:
    image: haproxy:3.2.26-alpine3.24@sha256:5893840576071e6217cd52ebdcc14f454c6f7a631056fa6f4e0f40d3cac4215b
    restart: unless-stopped
    # root only to open the socket (root:docker 0660; the gid differs per
    # host); no capabilities, read-only filesystem, no published port.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - ./deploy/docker-api-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - docker-api

networks:
  # Only autoheal and its proxy; internal = no route out of the host.
  docker-api:
    internal: true

volumes:
  api-tmp:
