services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # Default binds to loopback only: nothing on the LAN/internet can reach
      # the API directly, regardless of firewall layers. Use a reverse proxy
      # (Caddy) for external access.
      # Known issue: OrbStack (<= 2.2.0) fails to forward loopback-bound ports
      # when host and container ports match — set BIND_ADDR=0.0.0.0 in .env
      # as a workaround (see https://github.com/orbstack/orbstack/issues/944).
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env file}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3001}
      - SERVER_HOST=${SERVER_HOST:-localhost}
      - SERVER_USER=${SERVER_USER:-deploy}
      - HOST_REPOS_DIR=${HOST_REPOS_DIR:-/app/data/repos}
      # Cap Node heap so a slow leak triggers a clean OOM-restart instead of dragging the host down
      - NODE_OPTIONS=--max-old-space-size=2048
    # The code is the image's (server/Dockerfile): no source mount, no watch.
    # Server changes need a rebuild (`docker compose up -d --build api`); for
    # hot reload run `pnpm dev:server` on the host instead (README "Develop").
    # The root filesystem is read-only, so nothing — not even a compromised
    # server process — can change the code it runs; the server writes only
    # under /app/data (databases, repositories) and /tmp (push-check
    # snapshots, make-public scratch clones; disk-backed, not tmpfs, since a
    # scratch clone can be large).
    read_only: true
    volumes:
      # SQLite databases, company repositories, archives
      - ./data:/app/data
      - api-tmp:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:3001/api/config\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

  admin:
    # Production build (next build + standalone server), also for local runs:
    # the admin is internet-facing in production and must not run `next dev`.
    # Source changes need a rebuild (`docker compose up -d --build admin`);
    # for hot reload run `pnpm dev:admin` on the host instead (README "Develop").
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
      # Loopback by default — see the api service note
      - "${BIND_ADDR:-127.0.0.1}:3100:3100"
    environment:
      # Server-side /api/* proxy target, read at runtime by admin/src/proxy.ts —
      # must reach the api container over the compose network (localhost
      # inside the admin container is admin itself)
      - API_PROXY_URL=http://api:3001
      # Cap Node heap (smaller than api: admin is mostly static rendering)
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:3100/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  api-tmp:
